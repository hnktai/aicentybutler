services:
  engine:
    image: ${BUTLER_IMAGE:?set BUTLER_IMAGE to an immutable digest}
    container_name: aicenty-butler-engine
    restart: unless-stopped
    init: true
    read_only: true
    stop_grace_period: 30s
    env_file:
      - ${BUTLER_ENV_FILE:-/etc/aicenty-butler/goclaw.env}
    environment:
      APP_ENV: production
      GOCLAW_HOST: 0.0.0.0
      GOCLAW_PORT: "18790"
    ports:
      - "127.0.0.1:18895:18790"
    volumes:
      - goclaw_data:/app/data
      - goclaw_workspace:/app/workspace
      - goclaw_skills:/app/skills
      - zalo_sessions:/app/data/sessions
      - butler_media:/app/data/media
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
    pids_limit: 200
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE to an immutable digest}
    container_name: aicenty-butler-postgres
    restart: unless-stopped
    read_only: true
    environment:
      POSTGRES_DB: aicenty_butler_db
      POSTGRES_USER: aicenty_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_wal_size=4GB
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql:rw,nosuid,nodev,size=16m
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicenty_user -d aicenty_butler_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    pids_limit: 200
    mem_limit: 2g
    cpus: 1.5
    networks:
      - internal

  redis:
    image: ${REDIS_IMAGE:?set REDIS_IMAGE to an immutable digest}
    container_name: aicenty-butler-redis
    restart: unless-stopped
    read_only: true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - volatile-lru
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    pids_limit: 100
    mem_limit: 768m
    cpus: 0.75
    networks:
      - internal

volumes:
  goclaw_data:
  goclaw_workspace:
  goclaw_skills:
  postgres_data:
  redis_data:
  zalo_sessions:
  butler_media:

networks:
  internal:
    driver: bridge
