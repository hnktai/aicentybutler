    <script>
      (function() {
        function replaceText(node) {
          if (node.nodeType === Node.TEXT_NODE) {
            if (node.nodeValue && node.nodeValue.includes('GoClaw')) {
              node.nodeValue = node.nodeValue.replace(/GoClaw/g, 'Aicenty Butler');
            }
          } else if (node.nodeType === Node.ELEMENT_NODE) {
            if (node.tagName === 'INPUT' || node.tagName === 'TEXTAREA') {
              if (node.placeholder && node.placeholder.includes('GoClaw')) {
                node.placeholder = node.placeholder.replace(/GoClaw/g, 'Aicenty Butler');
              }
            }
            for (let child of node.childNodes) {
              replaceText(child);
            }
          }
        }

        const observer = new MutationObserver((mutations) => {
          for (let mutation of mutations) {
            for (let node of mutation.addedNodes) {
              replaceText(node);
            }
          }
          if (document.title.includes('GoClaw')) {
            document.title = document.title.replace(/GoClaw/g, 'Aicenty Butler');
          }
        });

        observer.observe(document.documentElement, {
          childList: true,
          subtree: true,
          characterData: true
        });

        document.addEventListener('DOMContentLoaded', () => {
          replaceText(document.body);
          if (document.title.includes('GoClaw')) {
            document.title = document.title.replace(/GoClaw/g, 'Aicenty Butler');
          }
        });
