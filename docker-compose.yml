services:
  aicenty-butler-core:
    image: aicenty-butler-runtime:${AICENTY_BUTLER_IMAGE_TAG:-production-sync-20261113}
    build:
      context: .
      dockerfile: docker/Dockerfile.aicenty-document-pdf
      args:
        VERSION: ${AICENTY_BUTLER_VERSION:-production-sync-20261113}
        COMMIT_SHA: ${AICENTY_BUTLER_COMMIT_SHA:-unknown}
    container_name: aicenty-butler-engine
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:18895:18790"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - PORT=18790
      - GOCLAW_HOST=0.0.0.0
      - GOCLAW_PORT=18790
      - GOCLAW_GATEWAY_TOKEN=${GOCLAW_GATEWAY_TOKEN}
      - GOCLAW_GEMINI_API_KEY=${GOCLAW_GEMINI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_AI_STUDIO_API_KEY=${GOOGLE_AI_STUDIO_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DB_HOST=aicenty-butler-postgres
      - DB_PORT=5432
      - DB_NAME=aicenty_butler_db
      - DB_USER=aicenty_user
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=aicenty-butler-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - AICENTY_DOCUMENT_RENDERER_URL=http://aicenty-document-renderer:8787
      - AICENTY_WEB_PDF_RENDERER_URL=http://aicenty-web-pdf-renderer:8787
    volumes:
      - aicenty_runtime_data:/app/data
      - aicenty_workspace:/app/workspace
      - zalo_sessions_vault:/opt/goclaw-aicenty/data/sessions
      - aicenty_media_vault:/opt/goclaw-aicenty/data/media
    networks:
      - aicenty_internal_net
      - document_render
    depends_on:
      aicenty-butler-postgres:
        condition: service_healthy
      aicenty-butler-redis:
        condition: service_healthy
      aicenty-document-renderer:
        condition: service_healthy
      aicenty-web-pdf-renderer:
        condition: service_healthy

  aicenty-document-renderer:
    image: aicenty-document-renderer:${AICENTY_DOCUMENT_RENDERER_TAG:-1.0.5}
    build:
      context: .
      dockerfile: docker/Dockerfile.aicenty-document-renderer
    container_name: aicenty-document-renderer
    restart: unless-stopped
    init: true
    read_only: true
    stop_grace_period: 30s
    environment:
      - PORT=8787
      - ALLOWED_MODES=text,word
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 2g
    cpus: 1.5
    networks:
      - document_render
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  aicenty-web-pdf-renderer:
    image: aicenty-document-renderer:${AICENTY_DOCUMENT_RENDERER_TAG:-1.0.5}
    container_name: aicenty-web-pdf-renderer
    restart: unless-stopped
    init: true
    read_only: true
    stop_grace_period: 30s
    environment:
      - PORT=8787
      - ALLOWED_MODES=web
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 2g
    cpus: 1.5
    networks:
      - document_render
      - web_egress
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  aicenty-butler-postgres:
    image: pgvector/pgvector:pg16
    container_name: aicenty-butler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aicenty_butler_db
      POSTGRES_USER: aicenty_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=16MB
      -c max_wal_size=4GB
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - aicenty_pgdata:/var/lib/postgresql/data
    networks:
      - aicenty_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicenty_user -d aicenty_butler_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  aicenty-butler-redis:
    image: redis:7-alpine
    container_name: aicenty-butler-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy volatile-lru
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - aicenty_redisdata:/data
    networks:
      - aicenty_internal_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  aicenty_pgdata:
  aicenty_redisdata:
  aicenty_runtime_data:
    external: true
    name: goclaw-aicenty_aicenty_runtime_data
  aicenty_workspace:
    external: true
    name: goclaw-aicenty_aicenty_workspace
  zalo_sessions_vault:
  aicenty_media_vault:

networks:
  aicenty_internal_net:
    driver: bridge
  document_render:
    driver: bridge
    internal: true
  web_egress:
    driver: bridge
