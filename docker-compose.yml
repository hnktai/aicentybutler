services:
  aicenty-butler-core:
    image: ghcr.io/nextlevelbuilder/goclaw:latest
    container_name: aicenty-butler-engine
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:18895:18790"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - PORT=18790
      - GOCLAW_HOST=0.0.0.0
      - GOCLAW_PORT=18790
      - GOCLAW_GATEWAY_TOKEN=${GOCLAW_GATEWAY_TOKEN}
      - DB_HOST=aicenty-butler-postgres
      - DB_PORT=5432
      - DB_NAME=aicenty_butler_db
      - DB_USER=aicenty_user
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=aicenty-butler-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - zalo_sessions_vault:/opt/goclaw-aicenty/data/sessions
      - aicenty_media_vault:/opt/goclaw-aicenty/data/media
    networks:
      - aicenty_internal_net
    depends_on:
      aicenty-butler-postgres:
        condition: service_healthy
      aicenty-butler-redis:
        condition: service_healthy

  aicenty-butler-postgres:
    image: pgvector/pgvector:pg16
    container_name: aicenty-butler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aicenty_butler_db
      POSTGRES_USER: aicenty_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=16MB
      -c max_wal_size=4GB
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - aicenty_pgdata:/var/lib/postgresql/data
    networks:
      - aicenty_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicenty_user -d aicenty_butler_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  aicenty-butler-redis:
    image: redis:7-alpine
    container_name: aicenty-butler-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy volatile-lru
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - aicenty_redisdata:/data
    networks:
      - aicenty_internal_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  aicenty_pgdata:
  aicenty_redisdata:
  zalo_sessions_vault:
  aicenty_media_vault:

networks:
  aicenty_internal_net:
    driver: bridge
