# /opt/goclaw-aicenty/config/agents-registry.yaml
context_management:
  sliding_window_turns: 10
  auto_summarize_threshold: 12
  summary_target: "family_episodic_memories"
  max_context_tokens_guard: 4000

llm_gateway:
  primary_provider: "gemini"
  routing_strategy: "pure_gemini_semantic_router"
  tier_1_model: "gemini-2.5-pro"
  tier_2_model: "gemini-2.0-flash"
  failover_backup:
    provider: "google_ai_studio"
    tier_1_backup: "gemini-2.5-pro"
    tier_2_backup: "gemini-2.5-flash"
    auto_revert_to_primary: true
  circuit_breaker:
    enabled: true
    request_timeout_ms: 4500
    failure_threshold: 3
    open_state_duration_seconds: 60

agents:
  - id: "aicenty-master-butler"
    name: "Quản Gia Đa Năng Aicenty Butler"
    role: "Master Orchestrator"
    model_tier: "tier_1"
    default_model: "gemini-2.5-pro"
  - id: "butler-guru"
    name: "Butler Guru - Chuyên Gia Setup Kỹ Thuật & Cố Vấn Giải Pháp"
    role: "Onboarding & Technical Solution Specialist (Zalo OA / Webchat)"
    model_tier: "tier_1"
    default_model: "gemini-2.5-pro"
  - id: "giasu-tieuhoc-toan-tiengviet"
